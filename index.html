<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6fc2ef">
<title>The Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: one phone-width game column — a scrollable illustrated world under a floating HUD, quest dock and tab bar. Single committed daylight look. */
:root{
  --ink:#1d2742;          /* deep evening navy for text */
  --ink-soft:#56607d;
  --paper:#fffaf1;        /* parchment card */
  --paper-2:#f6eedd;
  --gold:#f2b23a;         /* Holiness / XP */
  --rose:#ec6a6e;         /* Communion */
  --sea:#169fb5;          /* Mission */
  --leaf:#3f9e48;
  --sky:#8fd0f4;
  --line:rgba(29,39,66,.12);
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --navh:72px;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:linear-gradient(180deg,#6fc2ef 0%,#bfe6f7 45%,#2aa7bf 100%);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
:root.big body{font-size:17px}
button{font:inherit;color:inherit}
*{box-sizing:border-box}
:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px var(--ink)}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
p{margin:0;line-height:1.5}

#app{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;overflow:clip;background:#cfeefb;box-shadow:0 0 0 1px rgba(255,255,255,.4),0 30px 80px rgba(10,40,70,.35)}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.pad{padding:18px 16px calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px))}

/* ---------- buttons, chips, cards ---------- */
.btn{appearance:none;border:0;cursor:pointer;border-radius:16px;padding:14px 18px;font-weight:800;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s, box-shadow .15s;text-decoration:none}
.btn:active{transform:translateY(2px)}
.btn-gold{background:linear-gradient(180deg,#ffd36b,#f0a52b);color:#4a2c00;box-shadow:0 4px 0 #c27d12,0 10px 20px rgba(194,125,18,.35)}
.btn-gold:active{box-shadow:0 2px 0 #c27d12}
.btn-ink{background:linear-gradient(180deg,#34406a,#1d2742);color:#fff;box-shadow:0 4px 0 #0e1428,0 10px 18px rgba(14,20,40,.3)}
.btn-ghost{background:rgba(29,39,66,.07);color:var(--ink)}
.btn-white{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(29,39,66,.18)}
.btn-block{width:100%}
.btn-sm{padding:9px 13px;font-size:.88rem;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-weight:800;font-size:.76rem;letter-spacing:.02em;background:rgba(29,39,66,.07);color:var(--ink)}
.chip.H{background:#fff1cf;color:#8a5a00}.chip.C{background:#ffe1df;color:#a3343a}.chip.M{background:#d6f3f6;color:#0d6a79}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;cursor:pointer;font-size:.92rem}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.card{background:var(--paper);border-radius:22px;padding:16px;box-shadow:0 1px 0 #fff inset,0 10px 30px rgba(29,39,66,.12)}
.eyebrow{font-size:.72rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
input[type=text],input[type=search],input[type=time],textarea,select{width:100%;font:inherit;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label.lbl{font-weight:800;font-size:.85rem;display:block;margin-bottom:6px}
.icon{width:22px;height:22px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- tab bar ---------- */
#nav{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:var(--navh);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,250,241,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;box-shadow:0 12px 30px rgba(14,30,60,.25),0 1px 0 #fff inset;z-index:30}
#nav button{appearance:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:.72rem;color:var(--ink-soft);border-radius:20px;margin:6px}
#nav button[aria-current="page"]{color:var(--ink);background:linear-gradient(180deg,#fff,#f6ead0)}
#nav button[aria-current="page"] .icon{transform:translateY(-1px) scale(1.08)}

/* ---------- home world ---------- */
#world > svg,#isleWorld > svg{display:block;width:100%;height:auto}
.hud{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:20;display:flex;gap:10px;align-items:center;padding:8px 12px 8px 8px;border-radius:22px;background:rgba(255,250,241,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 26px rgba(14,30,60,.2)}
.lvl{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:1.25rem;color:#4a2c00;background:radial-gradient(circle at 35% 30%,#fff3c4,#f5b53c 60%,#c97f12);box-shadow:0 3px 0 #a86a0e,0 0 0 3px #fff}
.xpbar{height:10px;border-radius:99px;background:rgba(29,39,66,.1);overflow:hidden;margin-top:5px}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffcf5c,#f39a1f);box-shadow:0 0 10px rgba(243,154,31,.6);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.hud .name{font-weight:900;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .sub{font-size:.74rem;font-weight:700;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock{position:absolute;left:12px;right:12px;bottom:calc(var(--navh) + 20px + env(safe-area-inset-bottom,0px));z-index:20;border-radius:24px;padding:12px;background:rgba(255,250,241,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 14px 34px rgba(14,30,60,.28);display:flex;gap:12px;align-items:center}
.dock .orb{width:54px;height:54px;border-radius:18px;flex:none;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.dock .t{font-weight:900;line-height:1.25;font-size:.98rem}
.dock .m{font-size:.76rem;font-weight:700;color:var(--ink-soft);margin-top:2px}
.orb.H{background:radial-gradient(circle at 35% 30%,#fff5d2,#f6c04f 65%,#d6901c)}
.orb.C{background:radial-gradient(circle at 35% 30%,#ffe2e0,#f2847f 65%,#c84b52)}
.orb.M{background:radial-gradient(circle at 35% 30%,#dcf8fb,#40bfd1 65%,#11819a)}
.orb.done{background:radial-gradient(circle at 35% 30%,#eaffdf,#6cc75c 65%,#2f8a35)}

.tap{cursor:pointer;outline:none}
.tap:focus-visible .hl{stroke:#fff;stroke-width:3}
.sway{animation:sway 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sway.d2{animation-delay:-2s}.sway.d3{animation-delay:-4s}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(560px)}}
.shimmer{animation:shim 3.2s ease-in-out infinite}
@keyframes shim{0%,100%{opacity:.1}50%{opacity:.75}}
.pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.rays{animation:spin 60s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.flap{animation:flap .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flap{to{transform:scaleY(.4)}}
.fly{animation:fly 22s linear infinite}
@keyframes fly{from{transform:translate(-60px,0)}to{transform:translate(480px,-40px)}}
.flutter{animation:flutter 9s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:translate(0,0)}25%{transform:translate(18px,-14px)}50%{transform:translate(4px,-26px)}75%{transform:translate(-14px,-10px)}}
.beam{animation:beam 4s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}
@keyframes beam{0%,100%{transform:rotate(-14deg);opacity:.35}50%{transform:rotate(14deg);opacity:.75}}
:root.calm *,:root.calm *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- explore ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:calc(6px + env(safe-area-inset-top,0px));margin-bottom:16px}
.page-head h1{font-size:2rem;color:#fff;text-shadow:0 2px 0 rgba(14,30,60,.25),0 8px 24px rgba(14,30,60,.25)}
.page-head .eyebrow{color:rgba(255,255,255,.9)}
.isle-card{position:relative;border-radius:28px;overflow:hidden;cursor:pointer;color:#fff;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;box-shadow:0 18px 40px rgba(14,30,60,.25);border:0;text-align:left;width:100%}
.isle-card > svg{position:absolute;inset:0;width:100%;height:100%}
.isle-card .txt{position:relative;z-index:2;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.isle-card h2{font-size:1.7rem}
.isle-card .meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.isle-card .meta span{background:rgba(255,255,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:5px 10px;border-radius:99px;font-weight:800;font-size:.75rem;text-shadow:none}
.quest-row{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:#fff;box-shadow:0 2px 0 rgba(29,39,66,.06);cursor:pointer;border:0;text-align:left;width:100%}
.quest-row .orb{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center}
.nature{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.nature button{border:0;background:#fff;border-radius:18px;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:.72rem;box-shadow:0 2px 0 rgba(29,39,66,.06)}
.nature svg{width:46px;height:46px}

/* ---------- community ---------- */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:rgba(255,255,255,.55);border-radius:16px;backdrop-filter:blur(8px)}
.seg button{border:0;background:none;padding:9px 4px;border-radius:12px;font-weight:800;font-size:.82rem;cursor:pointer;color:var(--ink)}
.seg button[aria-selected="true"]{background:#fff;box-shadow:0 2px 6px rgba(14,30,60,.12)}
.post{background:var(--paper);border-radius:20px;padding:14px;box-shadow:0 6px 18px rgba(14,30,60,.1)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:none}
.post .body{margin-top:10px;line-height:1.55}
.post .title{font-weight:900;margin-top:8px}
.post-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.react{border:0;background:rgba(29,39,66,.06);border-radius:12px;padding:7px 11px;font-weight:800;font-size:.8rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.react[aria-pressed="true"]{background:#fff1cf;color:#8a5a00}
.pending-tag{background:#fff1cf;color:#8a5a00;border-radius:8px;padding:3px 8px;font-size:.7rem;font-weight:900}
.safety{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:16px;background:rgba(255,255,255,.75);font-size:.82rem;line-height:1.45}
.fab{position:absolute;right:20px;bottom:calc(var(--navh) + 26px + env(safe-area-inset-bottom,0px));z-index:25;width:58px;height:58px;border-radius:20px;border:0;cursor:pointer;display:grid;place-items:center;background:linear-gradient(180deg,#ffd36b,#f0a52b);box-shadow:0 4px 0 #c27d12,0 12px 24px rgba(194,125,18,.4)}

/* ---------- profile ---------- */
.prof-hero{text-align:center;padding:10px 0 4px;color:#fff}
.prof-hero h1{font-size:1.9rem;text-shadow:0 2px 12px rgba(14,30,60,.3)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.7rem;font-weight:800;line-height:1.2}
.badge .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.badge.locked{opacity:.38;filter:grayscale(1)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:14px;border:3px solid #fff;cursor:pointer;box-shadow:0 0 0 2px var(--line);position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.sw:disabled{cursor:not-allowed;opacity:.45}
.toggle{position:relative;width:52px;height:30px;flex:none}
.toggle input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2}
.toggle span{position:absolute;inset:0;border-radius:99px;background:rgba(29,39,66,.18);transition:.2s}
.toggle span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.toggle input:checked+span{background:var(--leaf)}
.toggle input:checked+span::after{transform:translateX(22px)}
.toggle input:focus-visible+span{outline:3px solid var(--ink)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.hist{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none}

/* ---------- sheet / toast / fx ---------- */
#scrim{position:absolute;inset:0;background:rgba(14,22,44,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:88%;overflow-y:auto;background:var(--paper);border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);box-shadow:0 -12px 40px rgba(14,22,44,.3)}
#sheet.on{transform:none}
#sheet .grab{width:44px;height:5px;border-radius:9px;background:rgba(29,39,66,.18);margin:4px auto 12px}
.x{position:absolute;z-index:3;right:12px;top:12px;width:38px;height:38px;border-radius:12px;border:0;background:rgba(29,39,66,.07);cursor:pointer;display:grid;place-items:center}
.verse{font-family:var(--display);font-size:1.45rem;line-height:1.35;color:var(--ink)}
.ref{font-weight:900;color:#a06a00;margin-top:10px}
#toast{position:absolute;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:800;font-size:.88rem;z-index:90;opacity:0;pointer-events:none;transition:.3s;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.petal{position:absolute;z-index:95;pointer-events:none;width:12px;height:12px;border-radius:60% 0 60% 0;animation:petal 1.6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes petal{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.xpfloat{position:absolute;z-index:96;pointer-events:none;font-family:var(--display);font-size:2.2rem;color:#fff;text-shadow:0 3px 0 #c27d12,0 0 20px rgba(242,178,58,.9);animation:xpf 1.6s ease-out forwards}
@keyframes xpf{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-20px) scale(1.15);opacity:1}100%{transform:translate(-50%,-120px) scale(1);opacity:0}}

/* ---------- onboarding ---------- */
.ob{position:absolute;inset:0;z-index:50;overflow-y:auto;display:flex;flex-direction:column}
.ob-sky{position:relative;flex:none;height:min(52vh,420px);overflow:hidden}
.ob-sky > svg{position:absolute;inset:0;width:100%;height:100%}
.ob-body{flex:1;background:var(--paper);border-radius:30px 30px 0 0;margin-top:-30px;position:relative;padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.ob-title{font-size:3.2rem;line-height:1;letter-spacing:-.01em}
.steps{display:flex;gap:6px}
.steps i{height:6px;flex:1;border-radius:9px;background:rgba(29,39,66,.12)}
.steps i.on{background:var(--gold)}
.stage{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:18px;padding:12px;cursor:pointer;width:100%}
.stage[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.stage b{display:block}
.stage small{color:var(--ink-soft);font-weight:600}
.plist{max-height:260px;overflow-y:auto;border:2px solid var(--line);border-radius:16px;background:#fff}
.plist button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;font-weight:700}
.plist button:first-child{border-top:0}
.plist button[aria-pressed="true"]{background:#fff1cf}

/* chat & combo */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:9px 13px;border-radius:18px 18px 18px 6px;background:#fff;box-shadow:0 2px 6px rgba(14,30,60,.08);line-height:1.45;font-size:.93rem}
.msg .who{font-size:.72rem;font-weight:900;margin-bottom:2px}
.msg .tm{font-size:.66rem;color:var(--ink-soft);margin-top:3px;text-align:right}
.msg.me{align-self:flex-end;background:#ffe9a8;border-radius:18px 18px 6px 18px}
.msg.sys{align-self:center;background:rgba(255,255,255,.6);box-shadow:none;font-size:.76rem;font-weight:800;color:var(--ink-soft);border-radius:12px;text-align:center}
.daysep{align-self:center;font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(29,39,66,.35);padding:4px 10px;border-radius:99px}
.composer{position:absolute;left:12px;right:12px;bottom:calc(var(--navh) + 20px + env(safe-area-inset-bottom,0px));z-index:22;display:flex;gap:8px;padding:8px;background:rgba(255,250,241,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:20px;box-shadow:0 10px 26px rgba(14,30,60,.25)}
.composer input{border-radius:14px;padding:10px 12px}
.members{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.member{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;font-weight:800;min-width:56px;text-align:center}
.member .av{width:44px;height:44px;position:relative}
.member .crown{position:absolute;top:-8px;right:-6px;background:var(--gold);color:#4a2c00;border-radius:8px;font-size:.55rem;font-weight:900;padding:2px 4px}
.combo{position:relative}
.combo input{padding-right:44px}
.combo .ok{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--leaf)}
.combo input.chosen{border-color:var(--leaf);background:#f3fbef;font-weight:800}
/* holy land world */
.world{position:absolute;inset:0;z-index:40;background:#9fd6f6;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.world canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.wpins{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.wpin{position:absolute;left:0;top:0;pointer-events:auto;border:0;display:flex;align-items:center;gap:6px;padding:4px 11px 4px 4px;border-radius:999px;background:rgba(255,250,241,.95);box-shadow:0 6px 16px rgba(14,30,60,.25);font-family:var(--body);font-weight:900;font-size:.78rem;color:var(--ink);cursor:pointer;white-space:nowrap;transform-origin:50% 100%}

function completeQuest(id,kind){

function shareGraphic(m){
 const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,0,1350);g.addColorStop(0,'#8f7ee0');g.addColorStop(.5,'#f7a3b7');g.addColorStop(1,'#ffcf7a');x.fillStyle=g;x.fillRect(0,0,1080,1350);
 x.fillStyle='rgba(255,255,255,.25)';x.beginPath();x.arc(860,240,170,0,7);x.fill();
 x.fillStyle='rgba(255,250,241,.94)';rr(x,80,300,920,820,48);x.fill();
 x.fillStyle='#a06a00';x.font='900 30px Nunito, sans-serif';x.fillText('TESTIMONY',140,390);
 x.fillStyle='#1d2742';x.font='64px "Young Serif", Georgia, serif';let y=wrap(x,m.title||'My story',140,480,800,74,3);
 x.font='600 36px Nunito, sans-serif';x.fillStyle='#3a4466';y=wrap(x,m.body,140,y+30,800,52,m.verse?7:10);
 if(m.verse){x.font='italic 32px Georgia, serif';x.fillStyle='#a06a00';wrap(x,m.verse,140,y+40,800,44,3)}
 x.fillStyle='#fff';x.font='64px "Young Serif", Georgia, serif';x.fillText('The Way',80,1240);x.font='700 30px Nunito, sans-serif';x.fillText('Follow His Way. Grow in His Love.',80,1290);
 x.strokeStyle='#fff';x.lineWidth=10;x.lineCap='round';x.beginPath();x.moveTo(980,1180);x.lineTo(980,1290);x.moveTo(950,1215);x.lineTo(1010,1215);x.stroke();
 return c.toDataURL('image/png');
 function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
 function wrap(x,t,a,b,w,lh,max){const words=String(t).split(/\s+/);let line='',n=0;for(const wd of words){const test=line?line+' '+wd:wd;if(x.measureText(test).width>w&&line){if(++n>=max){x.fillText(line+'…',a,b);return b+lh}x.fillText(line,a,b);line=wd;b+=lh}else line=test}x.fillText(line,a,b);return b+lh}
}

  const r0=rectOf(el);
  if(r0.top<app.top+90||r0.bottom>app.bottom-200){screen.scrollTop+=r0.top-app.top-Math.max(100,(app.height-r0.height)*.3)}}

function rectOf(el){ // SVG groups report loose boxes; use the union of their drawn islands
 const parts=el.id==='isles'?[...el.querySelectorAll(':scope > g > svg')]:[el];
 const rs=parts.map(x=>{if(x.tagName!=='svg'||!x.ownerSVGElement)return x.getBoundingClientRect();
  const o=x.ownerSVGElement.getBoundingClientRect(),k=o.width/400,A=n=>+x.getAttribute(n);
  return {top:o.top+A('y')*k,left:o.left+A('x')*k,bottom:o.top+(A('y')+A('height'))*k,right:o.left+(A('x')+A('width'))*k}});
 const top=Math.min(...rs.map(r=>r.top)),bottom=Math.max(...rs.map(r=>r.bottom)),left=Math.min(...rs.map(r=>r.left)),right=Math.max(...rs.map(r=>r.right));
 return {top,bottom,left,right,width:right-left,height:bottom-top};
}

const sstep=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
const mixN=(a,b,t)=>a+(b-a)*t;
const bump=(dx,dz,r)=>Math.exp(-(dx*dx+dz*dz)/(r*r));

function segDist(px,pz,ax,az,bx,bz){const vx=bx-ax,vz=bz-az,t=Math.max(0,Math.min(1,((px-ax)*vx+(pz-az)*vz)/(vx*vx+vz*vz)));return Math.hypot(px-ax-vx*t,pz-az-vz*t)}
function riverDist(x,z){let d=1e9;for(let i=0;i<JORDAN.length-1;i++)d=Math.min(d,segDist(x,z,...JORDAN[i],...JORDAN[i+1]));return d}
const RS={ax:-50,az:62,dx:.65,dz:.76};
function H(x,z){
 let h=2.2+1.4*Math.sin(x*.07)*Math.cos(z*.06)+.9*Math.sin(x*.17+z*.11)+.45*Math.sin(x*.31-z*.23)+.25*Math.sin(x*.7+z*.5);
 h+=3.2*bump(x-6,0,22)*1;                // central hill country
 h+=24*bump(x+2,z-84,11);                // Sinai
 h+=27*bump(x-60,z+85,13);               // Ararat
 h+=4*bump(x-15,z+45,6);                 // Beatitudes hill
 h+=3*bump(x-11,z-25,5);                 // Mount of Olives
 h+=2.2*bump(x+9,z-23,3);                // Calvary
 h+=5*bump(x+18,z-16,4);                 // tomb cliff
 h=mixN(5.2,h,sstep(7,13,Math.hypot(x+1,z-30))); // Jerusalem plateau
 const coast=-55+6*Math.sin(z*.05)+3*Math.sin(z*.13);
 h=mixN(-4,h,sstep(-6,5,x-coast));
 const eg=Math.hypot((x-28)/11,(z+55)/12.5);h=mixN(-3.2,h,sstep(.7,1.2,eg));
 const ed=Math.hypot((x-35)/5.5,(z-41)/11);h=mixN(-2.5,h,sstep(.75,1.25,ed));
 h=mixN(-1.3,h,sstep(1.3,3.4,riverDist(x,z)));
 // Red Sea band with a dry crossing
 const rx=x-RS.ax,rz=z-RS.az,along=rx*RS.dx+rz*RS.dz,across=Math.abs(-rx*RS.dz+rz*RS.dx);
 if(along>-10&&along<75){let sea=mixN(-4,h,sstep(4,9,across));const cross=Math.abs(along-25);if(cross<3.2)sea=Math.max(sea,mixN(.55,sea,sstep(2.2,3.2,cross)));h=Math.min(h,sea)}
 const r=Math.max(Math.abs(x),Math.abs(z))/100;h=mixN(h,-4,sstep(.88,1,r));
 return h;
}
function groundColor(x,z,h,C){
 const n=Math.sin(x*.9)*Math.cos(z*.8)*.5+.5,n2=Math.sin(x*.23+3)*Math.sin(z*.19)*.5+.5;
 const desert=Math.min(1,sstep(48,70,z)+sstep(-28,-45,x)*sstep(30,55,z)+sstep(78,92,-z)*.3);
 const grass=C.grassA.clone().lerp(C.grassB,n*.6+n2*.4);
 const dry=C.dryA.clone().lerp(C.dryB,n);
 const c=grass.lerp(dry,desert*.92);
 if(h<.55)c.lerp(C.beach,sstep(.55,.15,h));
 if(h<-.2)c.copy(C.seabed);
 c.lerp(C.rock,sstep(8,14,h));
 c.lerp(C.snow,sstep(16.5,20,h));
 return c;
}

  box(1.6,2.6,.1,'#6b4024',0,1.3,4.02);[-1.8,1.8].forEach(x=>{const w=new T.Mesh(new T.CircleGeometry(.6,16),glow('#ffd56a'));w.position.set(x,2.8,4.03);lm.add(w)});
  const L=new T.PointLight(col('#ffd890'),1,14);L.position.set(0,3,6);lm.add(L);
  if(theme==='H'){const halo=new T.Mesh(new T.SphereGeometry(9,20,14),glow('#fff3c4',.12));halo.position.y=6;lm.add(halo);anims.push(t=>halo.scale.setScalar(1+.05*Math.sin(t*1.5)))}}
 if(theme==='C'){const roof=mesh(new T.ConeGeometry(6,3,8),mat('#ef6f6c'));roof.position.y=6;lm.add(roof);for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const po=mesh(new T.CylinderGeometry(.2,.2,4.6,6),mat('#fff4e6'));po.position.set(Math.cos(a)*5,2.3,Math.sin(a)*5);lm.add(po)}
  box(6,.3,2,'#a8693c',0,1.4,0);const fl=mesh(new T.CylinderGeometry(5.6,5.8,.4,24),mat('#e9d8b6'));fl.position.y=.2;lm.add(fl);
  const ls=[];for(let i=0;i<16;i++){const a=i/16*Math.PI*2;const b=new T.Mesh(new T.SphereGeometry(.22,8,6),glow(['#ffd54a','#ff8a80','#80deea','#b39ddb'][i%4]));b.position.set(Math.cos(a)*5.4,4.6,Math.sin(a)*5.4);lm.add(b);ls.push(b)}
  anims.push(t=>ls.forEach((b,i)=>b.scale.setScalar(.8+.3*Math.sin(t*3+i))));
  ['#3d6fd8','#e0a33a','#7a63c9','#c8423f'].forEach((c,i)=>{const q=qwPerson(T,mat,c,.9);q.position.set(-2.4+i*1.6,0,i%2?1.6:-1.6);q.rotation.y=i%2?Math.PI:0;lm.add(q)})}
 if(theme==='M'){const tw=mesh(new T.CylinderGeometry(1.4,2.2,11,16),mat('#ffffff'));tw.position.y=5.5;lm.add(tw);[3,7].forEach(y=>{const s=mesh(new T.CylinderGeometry(2.2-y*.075,2.22-y*.075,1.6,16),mat('#e2524f'));s.position.y=y;lm.add(s)});
  const lamp=new T.Mesh(new T.CylinderGeometry(1.3,1.3,1.6,16),glow('#ffe27a'));lamp.position.y=11.8;lm.add(lamp);const cap=mesh(new T.ConeGeometry(1.8,1.6,16),mat('#2b5c7a'));cap.position.y=13.4;lm.add(cap);const bal=mesh(new T.CylinderGeometry(2,2,.3,16),mat('#2b5c7a'));bal.position.y=11;lm.add(bal);
  const beam=new T.Mesh(new T.ConeGeometry(4,28,20,1,true),glow('#fff6c8',.22));beam.rotation.z=Math.PI/2;beam.position.set(14,0,0);const pivot=new T.Group();pivot.position.y=11.8;pivot.add(beam);lm.add(pivot);
  const L=new T.PointLight(col('#ffe9a8'),1.2,30);L.position.y=12;lm.add(L);anims.push(t=>pivot.rotation.y=t*.8);
  box(2,2.4,.1,'#2b5c7a',0,1.2,2.1)}
 scene.add(lm);
 /* distant islands (home only) */
 const isles=[];
 if(theme==='home'){[['H',-78,-70],['C',0,-98],['M',78,-70]].forEach(([k,x,z])=>{const gI=new T.Group();gI.position.set(x,0,z);gI.userData.isle=k;
   const top=mesh(new T.CylinderGeometry(11,9,3,18),mat(QW_THEMES[k].grass[0]));top.position.y=1.5;gI.add(top);
   const cl=mesh(new T.ConeGeometry(9,14,18),mat('#9a5f34'));cl.rotation.x=Math.PI;cl.position.y=-7;gI.add(cl);
   for(let i=0;i<5;i++){const a=i/5*Math.PI*2+.4;const tr=mesh(new T.IcosahedronGeometry(1.6,1),mat(['#6fb84a','#f39bb8','#f2a440'][i%3]));tr.position.set(Math.cos(a)*7,4.6,Math.sin(a)*7);gI.add(tr)}
   if(k==='H'){const b=mesh(new T.BoxGeometry(3,3,4),mat('#fff8ec'));b.position.y=4.5;gI.add(b);const r=mesh(new T.ConeGeometry(2.8,2,4),mat('#c45b4a'));r.rotation.y=Math.PI/4;r.position.y=7;gI.add(r)}
   if(k==='C'){const r=mesh(new T.ConeGeometry(3.6,2,8),mat('#ef6f6c'));r.position.y=6.6;gI.add(r);const f=mesh(new T.CylinderGeometry(3.2,3.2,2.4,8,1,true),mat('#fff4e6'));f.position.y=4.4;gI.add(f)}
   if(k==='M'){const tw=mesh(new T.CylinderGeometry(.9,1.3,7,12),mat('#ffffff'));tw.position.y=6.5;gI.add(tw);const l=new T.Mesh(new T.SphereGeometry(1,10,8),glow('#ffe27a'));l.position.y=10.4;gI.add(l)}
   gI.userData.base=Math.random()*6;scene.add(gI);isles.push(gI)});
  anims.push(t=>isles.forEach(o=>o.position.y=Math.sin(t*.8+o.userData.base)*.8))}
 /* clouds & birds */
 const cm=new T.MeshStandardMaterial({color:col('#ffffff'),roughness:1,transparent:true,opacity:.95}),clouds=[];
 for(let i=0;i<10;i++){const c=new T.Group();for(let j=0;j<5;j++){const s=new T.Mesh(new T.SphereGeometry(2.2+Math.random()*2.4,12,10),cm);s.position.set(j*2.6-5,Math.random()*1.4,Math.random()*2-1);s.scale.y=.7;c.add(s)}c.position.set((Math.random()-.5)*260,62+Math.random()*12,-60-Math.random()*140);c.userData.v=.6+Math.random()*.8;scene.add(c);clouds.push(c)}
 const birds=[];for(let i=0;i<4;i++){const b=new T.Group();[-1,1].forEach(s=>{const w=new T.Mesh(new T.BoxGeometry(1,.06,.28),mat('#2b3550'));w.position.x=s*.46;b.add(w)});b.userData={r:16+Math.random()*16,h:13+Math.random()*5,s:.25+Math.random()*.25,p:Math.random()*6};scene.add(b);birds.push(b)}
 anims.push((t,dt)=>{clouds.forEach(c=>{c.position.x+=c.userData.v*dt;if(c.position.x>120)c.position.x=-120});birds.forEach(b=>{const u=b.userData,a=t*u.s+u.p;b.position.set(Math.cos(a)*u.r,u.h,Math.sin(a)*u.r);b.rotation.y=-a;b.children.forEach((w,i)=>w.rotation.z=(i?-1:1)*Math.sin(t*8+u.p)*.5)})});
 /* nodes & avatar groups (filled per render) */
 const nodes=new T.Group();scene.add(nodes);
 const av=new T.Group();const avBody=qwPerson(T,mat,'#3d6fd8',1.25,true);av.add(avBody);scene.add(av);
 QW.scenes[theme]={scene,anims,curve,samples,H,terrain,nodes,av,avBody,pathTop,pathEdge,natureMeshes,lm,isles,mat,glow,col,sun,nodeList:[],pins:[]};
}
function qwPerson(T,mat,robe,s,staff){const g=new T.Group();const m=(geo,c)=>{const o=new T.Mesh(geo,mat(c));o.castShadow=true;return o};
 const body=m(new T.CylinderGeometry(.32,.62,1.35,10),robe);body.position.y=.68;body.userData.robe=1;g.add(body);
 const sash=m(new T.CylinderGeometry(.35,.4,.14,10),'#f2b23a');sash.position.y=.95;g.add(sash);
 const head=m(new T.SphereGeometry(.36,14,10),'#f2c79a');head.position.y=1.62;g.add(head);
 const hair=m(new T.SphereGeometry(.38,14,10,0,Math.PI*2,0,Math.PI*.55),'#4a2e1b');hair.position.y=1.67;g.add(hair);
 if(staff){const st=m(new T.CylinderGeometry(.05,.05,2.2,6),'#7a4d2b');st.position.set(.55,1.1,0);g.add(st)}
 g.scale.setScalar(s);return g}
function setQWNodes(items,f0,f1){
 const Sc=QW.scenes[QW.theme],T=QW.T,{curve,H,nodes,mat,glow}=Sc;
 // path colours follow the chosen path style on Home
 const Pst=PATHS.find(p=>p[0]===S.look.path)||PATHS[0];
 const pc=QW.theme==='home'?[Pst[3],Pst[4]]:{H:['#fff3d6','#d9b77a'],C:['#ffe3e3','#e3a1a4'],M:['#f6e2b4','#c9a265']}[QW.theme];
 Sc.pathTop.material.color.copy(Sc.col(pc[0]));Sc.pathEdge.material.color.copy(Sc.col(pc[1]));
 while(nodes.children.length)nodes.remove(nodes.children[0]);
 Sc.nodeList=[];const N=items.length;let avP=null;
 items.forEach((it,i)=>{const p=curve.getPointAt(f0+(N>1?i*(f1-f0)/(N-1):0));p.y=H(p.x,p.z);
  const g=new T.Group();g.position.copy(p);g.userData.node=i;
  const st=it.st,now=st==='now'||st==='now-done',dim=st==='next'||st==='wait';
  const base=new T.Mesh(new T.CylinderGeometry(1.5,1.8,.7,20),mat(dim?'#a9a194':'#c98a2a'));base.position.y=.45;base.castShadow=true;base.receiveShadow=true;g.add(base);
  const orb=new T.Mesh(new T.SphereGeometry(1.05,20,16),dim?mat(st==='wait'?'#c9d6e8':'#e8e3d8',{roughness:.6}):mat(now?'#fff1c2':'#f5b53c',{roughness:.3,metalness:.25,emissive:Sc.col(now?'#f2b23a':'#8a5a00'),emissiveIntensity:now?.55:.18}));orb.position.y=1.9;orb.castShadow=true;g.add(orb);
  if(now){const beam=new T.Mesh(new T.CylinderGeometry(.9,1.6,16,16,1,true),glow('#fff3c4',.25));beam.position.y=9;g.add(beam);const ring=new T.Mesh(new T.RingGeometry(1.9,2.4,32),glow('#ffe08a',.8));ring.rotation.x=-Math.PI/2;ring.position.y=.85;g.add(ring);g.userData.pulse=ring;
   const L=new T.PointLight(Sc.col('#ffe9a8'),1,10);L.position.y=3;g.add(L)}
  if(st==='done'||st==='now-done'){const ck=new T.Mesh(new T.TorusGeometry(.5,.12,6,16,Math.PI*1.2),glow('#ffffff'));ck.position.y=1.9;g.add(ck);g.userData.spin=ck}
  g.userData.orb=orb;nodes.add(g);Sc.nodeList.push({g,it,p});if(it.avatar)avP=p});
 // avatar
 Sc.av.visible=!!avP;if(avP){const q=curve.getPointAt(Math.min(1,f0+.01)),off=new T.Vector3(2.6,0,1.2);Sc.av.position.set(avP.x+off.x,H(avP.x+off.x,avP.z+off.z),avP.z+off.z);Sc.av.rotation.y=-.6}
 Sc.avBody.traverse(o=>{if(o.userData.robe)o.material=mat(S.look.robe)});
 // html pins
 const layer=QW.container.querySelector('.qwpins');
 layer.innerHTML=items.map((it,i)=>`<button class="qpin ${it.st==='now'||it.st==='now-done'?'now':it.st==='next'||it.st==='wait'?'next':'done'}" ${it.data} aria-label="${esc(it.aria)}">${esc(it.label)}</button>`).join('')
  +`<button class="qpin lm" data-qlm="${QW.theme}">${esc(QW_THEMES[QW.theme].name)}</button>`
  +(QW.theme==='home'?['H','C','M'].map(k=>`<button class="qpin isle" data-isle="${k}">${ISLES[k].full}</button>`).join(''):'');
 Sc.pins=[...layer.querySelectorAll('.qpin')];
 // camera focus: current node
 const focus=avP||Sc.nodeList[Sc.nodeList.length-1].p;QW.goal.set(focus.x,focus.y+1,focus.z-10);
 if(viewChanged||QW.lastTheme!==QW.theme){QW.target.copy(QW.goal);QW.az=0;QW.el=.8;QW.dist=60}QW.lastTheme=QW.theme;
}
function qwLoop(){
 requestAnimationFrame(qwLoop);if(!QW||!QW.active||!QW.container||!document.body.contains(QW.container))return;
 const Sc=QW.scenes[QW.theme];if(!Sc)return;const {R3,camera,T}=QW,dt=Math.min(QW.clock.getDelta(),.05),t=QW.clock.elapsedTime;
 const cv=R3.domElement,w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
 if(cv.width!==Math.floor(w*R3.getPixelRatio())||cv.height!==Math.floor(h*R3.getPixelRatio())){R3.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
 QW.target.lerp(QW.goal,Math.min(1,dt*3));
 const ce=Math.cos(QW.el),se=Math.sin(QW.el);camera.position.set(QW.target.x+Math.sin(QW.az)*ce*QW.dist,QW.target.y+se*QW.dist,QW.target.z+Math.cos(QW.az)*ce*QW.dist);camera.lookAt(QW.target);
 Sc.anims.forEach(f=>f(t,dt));
 Sc.nodeList.forEach(({g})=>{g.userData.orb.position.y=1.9+Math.sin(t*2+g.userData.node)*.15;if(g.userData.pulse){const k=(t*.8)%1;g.userData.pulse.scale.setScalar(1+k*.8);g.userData.pulse.material.opacity=.8*(1-k)}if(g.userData.spin)g.userData.spin.rotation.y=t*1.5});
 Sc.avBody.position.y=Math.abs(Math.sin(t*2.6))*.12;
 R3.render(Sc.scene,camera);
 // pins
 const v=new T.Vector3();const place=(el,x,y,z,minS=.72)=>{v.set(x,y,z);const d=camera.position.distanceTo(v);v.project(camera);const vis=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;el.style.display=vis?'':'none';if(vis){const sc=Math.max(minS,Math.min(1.05,60/d));el.style.transform=`translate(${((v.x+1)/2*w).toFixed(1)}px,${((1-v.y)/2*h).toFixed(1)}px) translate(-50%,-100%) scale(${sc.toFixed(3)})`;el.style.zIndex=String(1000-Math.round(d))}};
 Sc.nodeList.forEach(({p},i)=>Sc.pins[i]&&place(Sc.pins[i],p.x,p.y+3.6,p.z));
 const lmEl=Sc.pins[Sc.nodeList.length];if(lmEl){const top=QW.theme==='M'?15:QW.theme==='C'?8.5:13.5;place(lmEl,Sc.lm.position.x,Sc.lm.position.y+top,Sc.lm.position.z)}
 Sc.isles.forEach((o,i)=>{const el=Sc.pins[Sc.nodeList.length+1+i];if(el)place(el,o.position.x,o.position.y+11,o.position.z,.68)});
}
function bindQWInput(){
 const cv=QW.R3.domElement,pts=new Map();let moved=0,pinch=0,down=false;
 cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1){moved=0;down=true}else{down=false;const [a,b]=[...pts.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
 cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)QW.dist=Math.max(14,Math.min(120,QW.dist*pinch/d));pinch=d;return}
  moved+=Math.abs(dx)+Math.abs(dy);if(moved>8){
   if(e.shiftKey||e.buttons===2){QW.az-=dx*.006;QW.el=Math.max(.3,Math.min(1.4,QW.el+dy*.004))}
   else{// one-finger drag: rotate sideways, slide along the island forwards/back
    QW.az-=dx*.006;const k=QW.dist*.0022;QW.goal.x-=Math.sin(QW.az)*-dy*k;QW.goal.z-=Math.cos(QW.az)*-dy*k;
    QW.goal.x=Math.max(-40,Math.min(40,QW.goal.x));QW.goal.z=Math.max(-45,Math.min(45,QW.goal.z));QW.target.copy(QW.goal)}}});
 const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=0;if(down&&moved<=8&&e.type==='pointerup')qwTap(e.clientX,e.clientY);down=false};
 cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('contextmenu',e=>e.preventDefault());
 cv.addEventListener('wheel',e=>{e.preventDefault();QW.dist=Math.max(14,Math.min(120,QW.dist*(1+Math.sign(e.deltaY)*.1)))},{passive:false});
}
function qwTap(cx,cy){
 const Sc=QW.scenes[QW.theme],T=QW.T,r=QW.R3.domElement.getBoundingClientRect();
 const rc=new T.Raycaster();rc.setFromCamera(new T.Vector2((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1),QW.camera);
 const objs=[...Sc.nodeList.map(n=>n.g),Sc.lm,...Sc.isles,...Sc.natureMeshes,Sc.terrain];
 const hit=rc.intersectObjects(objs,true)[0];if(!hit)return;
 let o=hit.object;while(o&&o.userData.node===undefined&&!o.userData.landmark&&!o.userData.isle&&!o.userData.nature&&o.parent)o=o.parent;
 if(o.userData.node!==undefined){Sc.pins[o.userData.node]?.click();return}
 if(o.userData.landmark){const lmPin=Sc.pins[Sc.nodeList.length];lmPin&&lmPin.click();return}
 if(o.userData.isle){go('explore',o.userData.isle);return}
 if(o.userData.nature){natureSheet(natureContent(QW.theme+o.userData.nature+hit.instanceId,QW.theme==='home'?undefined:QW.theme));return}
 QW.goal.set(hit.point.x,hit.point.y+1,hit.point.z);
}

function stampPlace(id){
 if(visited().includes(id))return;S.visited.push(id);S.xp+=10;save();celebrate(10);updateCount();
 const n=S.visited.length;toast(n===PLACES.length?'Every stamp collected. Pilgrimage complete!':`Stamp added · ${n} of ${PLACES.length} in your Pilgrim Passport`);
 openStory(id);
}
